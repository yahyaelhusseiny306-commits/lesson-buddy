<style>
:root{--bg1:#0B1F4B;--bg2:#143A8A;--ink:#0F1E3F;--txt:#EAF0FF;--muted:#A9B8DF;--line:#D6DEF5;--mark:#FFE066;--acc:#3B82F6;--card:#FFFFFF;--soft:#EEF3FF}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Arial,sans-serif;color:var(--txt);
background:radial-gradient(1200px 600px at 80% -10%,#2456C7 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#1E3F97 0%,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit}
.hdr{position:sticky;top:0;z-index:10;background:rgba(11,31,75,.85);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.12);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr .title{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;color:#fff}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.ib{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:5px 9px;font-size:12px;font-family:ui-monospace,monospace;cursor:pointer}
.ib.plain{border:none;background:none;font-size:20px;padding:2px 6px}
.wrap{padding:16px;max-width:560px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{aspect-ratio:1;border-radius:16px;color:#fff;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;transition:transform .1s}
.tile:active{transform:scale(.96)}
.tile b{font-size:16px;line-height:1.1}.tile small{opacity:.85;font-size:11px}
.tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
.tool{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;font-size:13px}
.tool b{display:block;font-size:22px;margin-bottom:4px}
.lbl{font-family:ui-monospace,monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px}
.card .lbl{color:#6B7A99}
.inp{width:100%;padding:10px 12px;border:1px solid rgba(255,255,255,.3);border-radius:10px;background:rgba(255,255,255,.95);color:var(--ink)}
textarea.inp{resize:vertical}
.btn{width:100%;padding:12px;border:none;border-radius:12px;color:#fff;font-weight:700;background:linear-gradient(135deg,#F59E0B,#F97316);box-shadow:0 6px 16px rgba(249,115,22,.35);cursor:pointer}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.o{background:#fff;color:var(--acc);border:1px solid var(--acc);font-weight:600;font-size:14px;padding:9px;box-shadow:none}
.btn.g{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);box-shadow:none;font-weight:600;font-size:14px;padding:10px}
.row{display:flex;gap:8px}.row>*{flex:1}
.tabs{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.08)}
.tabs button{flex:1;padding:10px;border:none;background:transparent;color:#fff;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc)}
.card{background:var(--card);color:var(--ink);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card h2{margin:0 0 10px;font-size:20px}
.card h3{margin:14px 0 4px;font-size:16px;color:var(--acc)}
.card p{margin:0 0 8px;line-height:1.6;color:#2B3A5C;white-space:pre-line}
mark{background:var(--mark);color:var(--ink);padding:0 4px;border-radius:2px;font-weight:600}
.ex{background:var(--soft);border-radius:10px;padding:10px;font-size:14px}
.sum{font-style:italic;border-top:1px solid #E5E9F5;padding-top:10px;color:#4B5A7A;font-size:14px}
.verify{background:#FFF8E1;border:1px solid #F5C518;border-radius:10px;padding:10px;font-size:14px;margin-top:10px;color:#3A2E00}
.verify b{color:#8A6100}.verify ul{margin:4px 0 0;padding-inline-start:20px}
.flag{background:none;border:none;color:#9AA6C3;font-size:12px;cursor:pointer;padding:0}
.flag:hover{color:#dc2626}
.sec-h{display:flex;justify-content:space-between;align-items:center}
.flagbox{display:flex;gap:6px;margin:6px 0}.flagbox input{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.flagbox .fx{background:#dc2626;color:#fff;border:none;border-radius:8px;padding:6px 10px}
.flagbox .cn{background:none;border:none;color:#6b7280}
.spin{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;padding:12px 0}
.card .spin{color:#6B7A99}
.spin i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:r 1s linear infinite;display:inline-block}
.card .spin i{border-color:#d1d5db;border-top-color:#374151}
@keyframes r{to{transform:rotate(360deg)}}
.err{color:#FFB4B4;font-size:14px;background:rgba(220,38,38,.2);border:1px solid rgba(255,120,120,.4);border-radius:10px;padding:8px 10px}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.msg{font-size:14px;border-radius:12px;padding:8px 12px;max-width:85%;line-height:1.5}
.msg.u{color:#fff;margin-inline-start:auto;background:var(--acc)}
.msg.a{background:#fff;color:var(--ink)}
.q{background:#fff;color:var(--ink);border:2px solid transparent;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.q.ok{border-color:#16A34A}.q.bad{border-color:#DC2626}
.q .qt{display:flex;gap:8px;align-items:flex-start;font-weight:600}
.q .n{font-family:ui-monospace,monospace;font-size:12px;color:#9ca3af;margin-top:2px}
.opt{display:block;width:100%;text-align:start;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:8px;font-size:14px;cursor:pointer;color:var(--ink)}
.opt.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.fb{font-size:14px;border-top:1px solid #f3f4f6;padding-top:8px;margin-top:8px;color:#4b5563}
.score{text-align:center;border-radius:16px;padding:14px;background:#fff;color:var(--ink);margin-bottom:12px}
.score .big{font-size:40px;font-weight:800;color:var(--acc)}
.photo{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.95);color:var(--ink);border-radius:10px;padding:8px;margin-top:8px}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:6px}
.photo button{background:none;border:none;text-align:start;padding:0;font-size:14px;cursor:pointer;display:block}
.dash{width:100%;margin-top:8px;padding:9px;border:1px dashed rgba(255,255,255,.5);border-radius:10px;background:rgba(255,255,255,.08);font-size:14px;color:#fff;cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0}
.stack>*+*{margin-top:16px}
.pdfbar{position:sticky;top:0;background:rgba(11,31,75,.95);border-bottom:1px solid rgba(255,255,255,.15);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:10}
.pdfbar .b{padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);font-size:14px;cursor:pointer;text-decoration:none;color:#fff}
.pdfbar .b.p{background:#F97316;border-color:#F97316}
.pages{padding:12px;display:flex;flex-direction:column;gap:12px;min-height:100vh}
.pages img{width:100%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3);border-radius:6px}
.hidden{display:none!important}
.setbox{background:#fff;color:var(--ink);border-radius:16px;padding:16px}
.setbox ol{padding-inline-start:20px;font-size:14px;line-height:1.7;color:#374151}
.setbox .inp{border-color:#d1d5db}
.setbox .chip{color:var(--ink);border-color:var(--line);background:#fff}.setbox .chip.on{color:#fff;background:var(--acc);border-color:var(--acc)}
a{color:#9DC1FF}.setbox a{color:var(--acc)}
.tog{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #eef}
.sw2{width:44px;height:26px;border-radius:13px;background:#cbd5e1;position:relative;cursor:pointer;border:none}
.sw2.on{background:#16A34A}.sw2::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw2.on::after{inset-inline-start:21px}
.hitem{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;margin-bottom:8px}
.hitem .t{font-weight:600}.hitem .m{font-size:12px;color:var(--muted)}
.hitem .del{background:none;border:none;color:#FFB4B4;font-size:18px;cursor:pointer}
.fc{perspective:1000px;height:260px;cursor:pointer}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-size:22px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.fc .f{background:#fff;color:var(--ink)}
.fc .b{background:var(--mark);color:var(--ink);transform:rotateY(180deg);font-size:18px;font-weight:500}
.fcbar{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-size:14px;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#F59E0B,#22C55E)}
.gitem{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:6px 0;border-top:1px solid rgba(255,255,255,.1)}
.genimg{width:100%;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);background:#fff}
</style>
</head>

let MODEL_CACHE=null,ALL_MODELS=[];
async function listModels(){
 if(MODEL_CACHE) return MODEL_CACHE;
 const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(S.apiKey)}&pageSize=200`);
 if(!res.ok){let m="";try{m=(await res.json()).error?.message||"";}catch(e){}throw new Error(`key check failed (HTTP ${res.status}): ${m}`);}
 const data=await res.json();
 ALL_MODELS=(data.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""));
 const names=ALL_MODELS.filter(n=>!/tts|image|audio|embedding|imagen|veo|live/.test(n));
 const score=n=>(/flash/.test(n)?0:5)+(/lite/.test(n)?1:0)+(/preview|exp/.test(n)?2:0)+(/thinking/.test(n)?3:0)-(parseFloat((n.match(/(\d+\.?\d*)/)||[0,0])[1])||0);
 names.sort((a,b)=>score(a)-score(b));
 MODEL_CACHE=names;return names;
}
// imgOverride: undefined => use S.photo ; null => no image ; object => that image
async function askAI(system,userText,history=[],imgOverride){
 if(!S.apiKey) throw new Error("nokey");
 const photo=imgOverride===undefined?S.photo:imgOverride;
 const contents=history.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
 const parts=[{text:userText}];
 if(photo) parts.push({inlineData:{mimeType:photo.mediaType,data:photo.data}});
 contents.push({role:"user",parts});
 const avail=await listModels();
 if(!avail.length) throw new Error("no models available for this key");
 const tryModels=[...new Set([...(avail.includes(S.model)?[S.model]:[]),...avail])].slice(0,6);
 const errs=[];
 for(const model of tryModels){
  const body=JSON.stringify({systemInstruction:{parts:[{text:system}]},contents,generationConfig:{temperature:0.3,maxOutputTokens:6000}});
  let res=null,netErr="";
  for(const ct of ["application/json","text/plain;charset=UTF-8"]){
   try{res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(S.apiKey)}`,{method:"POST",headers:{"Content-Type":ct},body});netErr="";break;}
   catch(e){netErr=e.message;res=null;}
  }
  if(!res){errs.push(`${model}: network ${netErr}`);continue;}
  if(res.ok){
   const data=await res.json();
   const txt=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("\n");
   if(!txt){errs.push(`${model}: empty`);continue;}
   if(model!==S.model){S.model=model;localStorage.setItem("model",model);}
   return txt;
  }
  let msg="";try{const j=await res.json();msg=j.error?.message||JSON.stringify(j);}catch(e){msg=await res.text();}
  errs.push(`${model}: HTTP ${res.status} ${msg.slice(0,140)}`);
  if(res.status===403||res.status===401) break;
 }
 throw new Error(errs.join(" | "));
}

async function polliB64(promptEn,w=1024,h=1024,seed=null){
 const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(promptEn)}?width=${w}&height=${h}&nologo=true&seed=${seed??Math.floor(Math.random()*1e6)}`;
 const r=await fetch(url);if(!r.ok)throw new Error("image HTTP "+r.status);
 const blob=await r.blob();
 const b64=await new Promise((res,rej)=>{
  const img=new Image();const u=URL.createObjectURL(blob);
  img.onload=()=>{try{const c=document.createElement("canvas");c.width=img.naturalWidth||w;c.height=img.naturalHeight||h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0);res(c.toDataURL("image/jpeg",0.9).split(",")[1]);}catch(e){rej(e);}finally{URL.revokeObjectURL(u);}};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("bad image"));};img.src=u;});
 return{mediaType:"image/jpeg",data:b64,url};
}

async function buildXlsx(doc){
 await loadLib("xlsx");
 const wb=XLSX.utils.book_new();
 for(const sh of doc.sheets||[]){
  const headers=sh.headers||[],rows=sh.rows||[];
  const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
  const n=rows.length;
  // numeric columns -> add totals & average rows with real formulas
  if(n>1){
   const numCols=headers.map((_,c)=>rows.filter(r=>typeof r[c]==="number").length>=Math.ceil(n*0.6));
   if(numCols.some(Boolean)){
    const L=c=>XLSX.utils.encode_col(c);
    const sumRow=n+2,avgRow=n+3;
    const lab0=sh.totalLabel||(S.lang==="ar"?"المجموع":"Total"),lab1=sh.averageLabel||(S.lang==="ar"?"المتوسط":"Average");
    XLSX.utils.sheet_add_aoa(ws,[[lab0],[lab1]],{origin:`A${sumRow}`});
    headers.forEach((_,c)=>{if(c===0||!numCols[c])return;
     ws[`${L(c)}${sumRow}`]={t:"n",f:`SUM(${L(c)}2:${L(c)}${n+1})`};
     ws[`${L(c)}${avgRow}`]={t:"n",f:`AVERAGE(${L(c)}2:${L(c)}${n+1})`};});
    ws["!ref"]=`A1:${L(headers.length-1)}${avgRow}`;
   }
  }
  if(sh.formulas)for(const f of sh.formulas){if(f.cell&&f.formula){ws[f.cell]={t:"n",f:String(f.formula).replace(/^=/,"")};const r=XLSX.utils.decode_range(ws["!ref"]),c=XLSX.utils.decode_cell(f.cell);r.e.r=Math.max(r.e.r,c.r);r.e.c=Math.max(r.e.c,c.c);ws["!ref"]=XLSX.utils.encode_range(r);}}
  ws["!cols"]=headers.map((h,c)=>({wch:Math.min(40,Math.max(12,...[String(h),...rows.map(r=>String(r[c]??""))].map(x=>x.length+3)))}));
  ws["!freeze"]={xSplit:0,ySplit:1};ws["!views"]=[{state:"frozen",ySplit:1,rightToLeft:S.lang==="ar"}];
  XLSX.utils.book_append_sheet(wb,ws,String(sh.name||"Sheet").slice(0,28));
 }
 const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
 return new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

const A4W=1240,A4H=1754,PM=90;
function makeDoc(rtl){
 const pages=[];let c,ctx,y;
 const np=()=>{c=document.createElement("canvas");c.width=A4W;c.height=A4H;ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,A4W,A4H);ctx.direction=rtl?"rtl":"ltr";ctx.textAlign=rtl?"right":"left";ctx.textBaseline="top";pages.push(c);y=PM;};
 np();
 const ensure=h=>{if(y+h>A4H-PM)np();};
 const font=(s,b,i)=>{ctx.font=`${i?"italic ":""}${b?"bold ":""}${s}px sans-serif`;};
 const text=(str,{size=30,bold=false,italic=false,color="#111",indent=0,gap=12}={})=>{
  font(size,bold,italic);const maxW=A4W-2*PM-indent;const lines=[];
  for(const para of String(str||"").split("\n")){let line="";for(const w of para.split(" ")){const tst=line?line+" "+w:w;if(ctx.measureText(tst).width>maxW&&line){lines.push(line);line=w;}else line=tst;}lines.push(line);}
  const lh=size*1.5;for(const l of lines){ensure(lh);font(size,bold,italic);ctx.fillStyle=color;ctx.fillText(l,rtl?A4W-PM-indent:PM+indent,y);y+=lh;}y+=gap;};
 const rule=(color,h=4)=>{ensure(h+24);ctx.fillStyle=color;ctx.fillRect(PM,y,A4W-2*PM,h);y+=h+24;};
 const aline=()=>{ensure(70);ctx.fillStyle="#999";ctx.fillRect(PM+40,y+50,A4W-2*PM-40,2);y+=70;};
 return{text,rule,aline,space:h=>{y+=h},pageBreak:np,pages:()=>pages};
}
function canvasesToPdf(cvs){
 const enc=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u;};
 const parts=[];let len=0;const off=[];const push=u=>{parts.push(u);len+=u.length;};const ps=s=>push(enc(s));
 ps("%PDF-1.4\n");const n=cvs.length,total=2+3*n;
 off[1]=len;ps("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
 off[2]=len;ps(`2 0 obj\n<< /Type /Pages /Kids [${cvs.map((_,i)=>`${3+i*3} 0 R`).join(" ")}] /Count ${n} >>\nendobj\n`);
 cvs.forEach((cv,i)=>{const p=3+i*3,ct=p+1,im=p+2;
  off[p]=len;ps(`${p} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im ${im} 0 R >> >> /Contents ${ct} 0 R >>\nendobj\n`);
  const cs="q 595 0 0 842 0 0 cm /Im Do Q";off[ct]=len;ps(`${ct} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
  const bytes=enc(atob(cv.toDataURL("image/jpeg",0.9).split(",")[1]));
  off[im]=len;ps(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`);push(bytes);ps("\nendstream\nendobj\n");});
 const xref=len;let x=`xref\n0 ${total+1}\n0000000000 65535 f \n`;for(let i=1;i<=total;i++)x+=String(off[i]).padStart(10,"0")+" 00000 n \n";
 ps(x+`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
 const out=new Uint8Array(len);let o=0;for(const p of parts){out.set(p,o);o+=p.length;}return new Blob([out],{type:"application/pdf"});
}

function viewGrades(tr){
 const bySub={};S.grades.forEach(g=>{(bySub[g.subject]=bySub[g.subject]||[]).push(g);});
 const ids=Object.keys(bySub);
 return header(tr,tr.grades,"S.screen='settings';render()")+`<div class="wrap stack">
 ${!ids.length?`<p style="color:var(--muted)">${tr.gradesEmpty}</p>`:ids.map(id=>{const sub=SUBJECTS.find(x=>x.id===id)||{};const gs=bySub[id];const avg=Math.round(100*gs.reduce((a,g)=>a+g.score/(g.total||1),0)/gs.length);
  return `<div class="card" style="background:rgba(255,255,255,.08);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.15)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b><span class="sw" style="background:${sub.color};margin-inline-end:6px"></span>${sub[S.lang]}</b><span>${tr.avg}: <b>${avg}%</b></span></div><div class="bar"><i style="width:${avg}%"></i></div>
  ${gs.slice(0,8).map(g=>`<div class="gitem"><span>${esc(g.lesson)}</span><span>${g.score}/${g.total} · ${fmtDate(g.ts)}</span></div>`).join("")}</div>`;}).join("")}
 </div>`;
}
function viewFlash(tr){
 const fc=S.fc;
 if(fc.done)return header(tr,tr.flash,"S.screen='subject';render()")+`<div class="wrap stack" style="text-align:center"><div class="card"><h2>🎉 ${tr.flashDone}</h2></div><button class="btn" onclick="startFlash()">${tr.again}</button></div>`;
 const c=fc.cards[fc.idx];
 return header(tr,tr.flash,"S.screen='subject';render()")+`<div class="wrap stack" dir="${S.subject.lang==="ar"?"rtl":"ltr"}">
 <div class="fcbar"><span>${fc.idx+1} / ${fc.cards.length}</span><span>${tr.round} ${fc.round}</span><span>${fc.unknown.length} ❌</span></div>
 <div class="fc ${fc.flip?"flip":""}" onclick="S.fc.flip=!S.fc.flip;render()"><div class="in"><div class="f"><mark>${esc(c.f)}</mark></div><div class="b">${esc(c.b)}</div></div></div>
 <p class="hint" style="text-align:center">${tr.flashTap}</p>
 <div class="row"><button class="btn g" onclick="fcAnswer(false)">${tr.unknown}</button><button class="btn" style="background:linear-gradient(135deg,#16A34A,#22C55E);box-shadow:none" onclick="fcAnswer(true)">${tr.known}</button></div></div>`;
}
function viewImg(tr){
 const im=S.img;
 const one=o=>`<img class="genimg" src="data:${o.mediaType};base64,${o.data}" alt=""><div class="row"><button class="btn g" onclick="shareBlob(b64ToBlob(S.img.out.data,S.img.out.mediaType),'image.png')">📤 ${tr.share}</button><a class="btn g" style="text-align:center;text-decoration:none" href="data:${o.mediaType};base64,${o.data}" download="image.png">⬇️ ${tr.download}</a></div>`;
 return header(tr,tr.imgTitle,"S.screen='home';render()")+`<div class="wrap stack">
 <textarea class="inp" rows="4" placeholder="${tr.imgPh}" oninput="S.img.prompt=this.value">${esc(im.prompt)}</textarea>
 <div><p class="lbl">${tr.imgStyle}</p><div class="chips">${tr.imgStyles.map(([id,l])=>`<button class="chip ${im.style===id?"on":""}" onclick="S.img.style='${id}';render()">${l}</button>`).join("")}</div></div>
 ${im.ref?`<div class="photo"><img src="${im.ref.preview}" alt=""><div><button style="color:var(--acc);font-weight:600" onclick="pickFile('img')">${tr.changePhoto}</button><button style="color:#6b7280" onclick="S.img.ref=null;render()">${tr.removePhoto}</button></div></div>`:`<button class="dash" onclick="pickFile('img')">${tr.imgRef}</button>`}
 <button class="btn" onclick="doImage()" ${im.busy?"disabled":""}>🎨 ${tr.imgGo}</button>
 ${im.busy?spinner(tr.thinking):""}
 ${im.err?`<p class="err">${esc(im.err)}</p>`:""}
 ${im.out?one(im.out):(im.outs.length>1?`<div class="grid" style="grid-template-columns:1fr 1fr">${im.outs.map((o,i)=>`<div style="cursor:pointer" onclick="S.img.out=S.img.outs[${i}];render()"><img class="genimg" src="data:${o.mediaType};base64,${o.data}" alt=""><button class="btn g" style="margin-top:6px">${tr.pick}</button></div>`).join("")}</div>`:"")}
 ${im.out&&im.outs.length>1?`<button class="btn g" onclick="S.img.out=null;render()">↩︎</button>`:""}
 ${(im.out||im.outs.length)?`<p class="hint">${(im.out||im.outs[0]).src==="pollinations"?(S.lang==="ar"?"صُنعت عبر Pollinations (مجاني)":"Made with Pollinations (free)"):"Gemini"}${(im.out||im.outs[0]).promptEn?` · <span dir="ltr">${esc((im.out||im.outs[0]).promptEn)}</span>`:""}</p>`:""}
 <p class="hint">${tr.imgNote}</p></div>`;
}
function viewDoc(tr){
 const d=S.doc;
 const types=[["word","📝 "+tr.docWord],["ppt","📊 "+tr.docPpt],["xls","📈 "+tr.docXls]];
 return header(tr,tr.docTitle,"S.screen=S.subject?'subject':'home';render()")+`<div class="wrap stack">
 <div><p class="lbl">${tr.docType}</p><div class="chips">${types.map(([id,l])=>`<button class="chip ${d.type===id?"on":""}" onclick="S.doc.type='${id}';render()">${l}</button>`).join("")}</div></div>
 <textarea class="inp" rows="4" placeholder="${tr.docPh}" oninput="S.doc.prompt=this.value">${esc(d.prompt)}</textarea>
 ${d.type!=="xls"?`<div><p class="lbl">${tr.docTheme}</p><div class="chips">${Object.keys(THEMES).map(k=>`<button class="chip ${d.theme===k?"on":""}" style="border-color:#${THEMES[k].c};${d.theme===k?`background:#${THEMES[k].a}`:""}" onclick="S.doc.theme='${k}';render()"><span class="sw" style="background:#${THEMES[k].c};margin-inline-end:6px"></span>${k}</button>`).join("")}</div></div>
 <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" ${d.images?"checked":""} onchange="S.doc.images=this.checked"> ${tr.docImages}</label>`:""}
 ${S.explanation?`<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" ${d.useLesson?"checked":""} onchange="S.doc.useLesson=this.checked"> ${tr.docUseLesson} (${esc(S.lesson)})</label>`:""}
 <button class="btn" onclick="doDoc()" ${d.busy?"disabled":""}>📄 ${tr.docGo}</button>
 ${d.busy?spinner(d.status||tr.thinking):""}
 ${d.err?`<p class="err">${esc(d.err)}</p>`:""}
 ${d.url?`<div class="card"><b>✅ ${tr.docReady}:</b> <span dir="ltr">${esc(d.name)}</span><div class="row" style="margin-top:10px"><button class="btn o" onclick="shareBlob(S.doc.blob,S.doc.name)">📤 ${tr.share}</button><a class="btn o" style="text-align:center;text-decoration:none" href="${d.url}" download="${esc(d.name)}">⬇️ ${tr.download}</a></div></div>`:""}
 </div>`;
}
function viewSubject(tr){
 const s=S.subject,col=s.color,cdir=s.lang==="ar"?"rtl":"ltr";
 const title=`<span class="sw" style="background:${col}"></span>${s[S.lang]}`;
 let h=header(tr,title,"goHome()")+`<div class="wrap stack" dir="${cdir}" style="--acc:${col}">
 <div><p class="lbl">${tr.lessonLabel}</p><input class="inp" value="${esc(S.lesson)}" placeholder="${tr.lessonPh}" oninput="S.lesson=this.value">
 ${S.photo?`<div class="photo"><img src="${S.photo.preview}" alt=""><div><button style="color:${col};font-weight:600" onclick="pickFile('lesson')">${tr.changePhoto}</button><button style="color:#6b7280" onclick="S.photo=null;render()">${tr.removePhoto}</button></div></div>`
  :`<button class="dash" onclick="pickFile('lesson')">${tr.addPhoto}</button><p class="hint">${tr.photoHint}</p>`}</div>
 <div class="tabs"><button class="${S.mode==="explain"?"on":""}" onclick="S.mode='explain';render()">📖 ${tr.explain}</button><button class="${S.mode==="exam"?"on":""}" onclick="S.mode='exam';render()">📝 ${tr.exam}</button></div>
 ${S.error?`<p class="err">${esc(S.error)}</p>`:""}`;
 if(S.mode==="explain"){
  h+=`<div><p class="lbl">${tr.styleLabel}</p><div class="chips">${tr.styles.map(([id,l])=>`<button class="chip ${S.style===id?"on":""}" onclick="S.style='${id}';render()">${l}</button>`).join("")}</div></div>
  <button class="btn" onclick="doExplain()" ${S.loading?"disabled":""}>${tr.goExplain}</button>
  ${S.loading&&!S.explanation?spinner(S.loadLabel||tr.thinking):""}`;
  const ex=S.explanation;
  if(ex){
   h+=`<div class="card"><h2><mark>${esc(ex.title)}</mark></h2><p>${esc(ex.overview)}</p>
   ${(ex.sections||[]).map((x,i)=>`<div class="sec-h"><h3>${esc(x.heading)}</h3><button class="flag" onclick="S.flagging={kind:'section',idx:${i},note:''};render()">⚑ ${tr.flag}</button></div><p>${esc(x.text)}</p>${flagBox("section",i,tr)}`).join("")}
   ${S.loading&&!S.flagging?spinner(S.loadLabel||tr.thinking):""}
   ${verify(ex.uncertain,tr)}
   ${ex.keyTerms?.length?`<p class="lbl" style="margin-top:12px">${tr.keyTerms}</p>${ex.keyTerms.map(k=>`<p style="font-size:14px;margin:0 0 4px"><mark>${esc(k.term)}</mark> — ${esc(k.meaning)}</p>`).join("")}
   ${S.feat.flash?`<button class="btn o" style="margin-top:8px" onclick="startFlash()">🃏 ${tr.flash}</button>`:""}`:""}
   ${ex.example?`<div class="ex" style="margin-top:10px"><span class="lbl">${tr.example}</span>${esc(ex.example)}</div>`:""}
   ${ex.summary?`<p class="sum" style="margin-top:10px"><span class="lbl" style="display:inline;font-style:normal">${tr.summary}: </span>${esc(ex.summary)}</p>`:""}
   <div class="row" style="margin-top:12px"><button class="btn o" onclick="openPdf('explain')">📄 ${tr.pdf}</button><button class="btn o" onclick="S.doc.useLesson=true;S.screen='doc';render()">📝 ${tr.docTool}</button></div></div>
   <div class="chat">${S.chat.map(m=>`<div class="msg ${m.role==="user"?"u":"a"}">${esc(m.content)}</div>`).join("")}
   ${S.loading&&S.chat.length&&S.chat[S.chat.length-1].role==="user"?spinner(tr.thinking):""}
   <div class="row" style="gap:8px"><input class="inp" id="fu" placeholder="${tr.askFollow}" style="flex:1"><button class="btn" style="flex:0 0 auto;width:auto;background:${col};box-shadow:none" onclick="const i=document.getElementById('fu');doFollowUp(i.value);i.value=''" ${S.loading?"disabled":""}>➤</button></div></div>`;
  }
 }else{
  if(!S.exam){
   h+=`<div><p class="lbl">${tr.customExam}</p><textarea class="inp" rows="4" placeholder="${tr.customExamPh}" oninput="S.customExam=this.value">${esc(S.customExam)}</textarea></div>
   <button class="btn" onclick="doExam()" ${S.loading?"disabled":""}>${tr.makeExam}</button>${S.loading?spinner(S.loadLabel||tr.thinking):""}`;
  }else{
   const r=S.result;
   h+=`<div class="row"><button class="btn o" onclick="openPdf('exam')">📄 ${tr.pdfQuestions}</button><button class="btn o" onclick="openPdf('examKey')">📄 ${tr.pdfAnswers}</button></div>${verify(S.examUncertain,tr)}
   ${r?`<div class="score"><p class="lbl">${tr.score}</p><div class="big">${r.score} / ${r.total}</div></div>`:""}
   <div>${S.exam.map((q,idx)=>{const it=r?.items?.find(i=>i.id===q.id);const cls=it?(it.correct?"ok":"bad"):"";
    return `<div class="q ${cls}"><div class="qt"><span class="n">${idx+1}</span><span style="flex:1">${esc(q.q)}</span>${it?(it.correct?"✅":"❌"):""}</div>${flagBox("question",idx,tr)}
    ${q.type==="short"?`<input class="inp" style="margin-top:8px;border-color:#d1d5db" ${r?"disabled":""} value="${esc(S.answers[q.id]||"")}" placeholder="${tr.yourAnswer}" oninput="S.answers[${q.id}]=this.value">`
     :(q.type==="tf"?["true","false"]:q.options).map(o=>`<button class="opt ${S.answers[q.id]===o?"on":""}" ${r?"disabled":""} onclick="S.answers[${q.id}]=${JSON.stringify(o).replace(/"/g,"&quot;")};render()">${esc(q.type==="tf"?(o==="true"?tr.trueL:tr.falseL):o)}</button>`).join("")}
    ${it?`<div class="fb">${!it.correct?`<span class="lbl" style="display:inline">${tr.correctAnswer}: </span><mark>${esc(q.type==="tf"?(q.answer==="true"?tr.trueL:tr.falseL):q.answer)}</mark><br>`:""}${esc(it.feedback)}</div>`:""}
    <div style="text-align:end;margin-top:6px"><button class="flag" onclick="S.flagging={kind:'question',idx:${idx},note:''};render()">⚑ ${tr.flag}</button></div></div>`;}).join("")}</div>
   ${S.loading?spinner(S.loadLabel||tr.thinking):""}
   ${!r?`<button class="btn" onclick="doGrade()" ${S.loading||Object.keys(S.answers).filter(k=>S.answers[k]).length<S.exam.length?"disabled":""}>${tr.submit}</button>`
    :`<div class="row"><button class="btn g" onclick="S.answers={};S.result=null;render()">↺ ${tr.tryAgain}</button><button class="btn" style="background:${col};box-shadow:none" onclick="S.exam=null;S.answers={};S.result=null;S.curSession=null;render()">${tr.newExam}</button></div>`}`;
  }
 }
 return h+"</div>";
}
function flagBox(kind,idx,tr){const f=S.flagging;if(!f||f.kind!==kind||f.idx!==idx)return"";
 return `<div class="flagbox"><input id="flagnote" value="${esc(f.note)}" placeholder="${tr.flagPh}"><button class="fx" onclick="submitFlag()">${tr.fix}</button><button class="cn" onclick="S.flagging=null;render()">${tr.cancel}</button></div>`;}
function verify(items,tr){return items&&items.length?`<div class="verify"><b>⚠️ ${tr.verify}</b><ul>${items.map(u=>`<li>${esc(u)}</li>`).join("")}</ul></div>`:"";}
function viewPdf(tr){
 return `<div class="pdfbar"><button class="b" onclick="S.printTarget=null;S.pdfUrl=null;S.pdfPages=[];render()">${tr.close}</button>
 ${S.pdfBusy?spinner(tr.thinking):""}
 ${S.pdfUrl?`<button class="b p" onclick="shareBlob(S.pdfBlob,pdfName())">📤 ${tr.share}</button><a class="b" href="${S.pdfUrl}" download="${pdfName()}">⬇️ ${tr.download}</a>`:""}</div>
 <div class="pages">${S.pdfPages.map((p,i)=>`<img src="${p}" alt="page ${i+1}">`).join("")}</div>`;
}
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
